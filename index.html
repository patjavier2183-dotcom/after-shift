<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>AFTER SHIFT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">AFTER SHIFT</a>
    <button class="ghost" id="loginBtn">Ingresar</button>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">CREATOR PLATFORM</div>
      <h1>Tu contenido.<br><span>Tu comunidad.</span></h1>
      <p>Una plataforma premium para descubrir creadores, seguir perfiles y acceder a contenido exclusivo.</p>
      <button class="primary" id="exploreBtn">Explorar creadores</button>
    </section>

    <section class="section" id="creators">
      <div class="section-head">
        <div>
          <div class="eyebrow">DESCUBRE</div>
          <h2>Creadores destacados</h2>
        </div>
        <button class="text-btn" id="allBtn">Ver todos</button>
      </div>
      <div class="grid" id="creatorGrid"></div>
    </section>
  </main>

  <footer>AFTER SHIFT · V0</footer>
  <script src="app.js"></script>
</body>
</html>
